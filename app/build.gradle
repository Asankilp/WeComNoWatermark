plugins {
    id 'com.android.application'
}

// CI 通过 -PappVersionCode / -PappVersionName 覆盖版本号；
// 本地构建不带这两个参数时，保持默认的 1 / 1.0。
def appVerCode = 1
def appVerName = '1.0'
try {
    def code = project.findProperty('appVersionCode')
    if (code != null) {
        appVerCode = code.toString().trim().toInteger()
    }
    def name = project.findProperty('appVersionName')
    if (name != null && name.toString().trim()) {
        appVerName = name.toString().trim()
    }
} catch (Exception ignored) {
    // 属性非法时回落到默认值，不让构建失败
}

android {
    namespace 'moe.erroro.wecomnowatermark'
    compileSdk 34

    defaultConfig {
        applicationId "moe.erroro.wecomnowatermark"
        minSdk 24
        targetSdk 34
        versionCode appVerCode
        versionName appVerName
    }

    buildFeatures {
        // Toast 里要显示版本号 / 判断是否调试版，需要 BuildConfig
        buildConfig true
    }

    buildTypes {
        release {
            // 用 AGP 自动生成的 debug 签名，保证 Release 产物可直接安装。
            // 想用自己的 keystore 就删掉这行，改成 signingConfigs.release。
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    // Xposed API 只在编译期需要，运行期由宿主框架提供
    compileOnly 'de.robv.android.xposed:api:82'
}
